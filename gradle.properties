# 2g, not 3g. At 3g the daemon repeatedly died mid-dex with "Native memory
# allocation (malloc) failed" — this machine also runs Docker (Myra + LaunchGear),
# WSL and a browser, and the JVM could not grow its native heap alongside them.
# The failure surfaces only as "Gradle build daemon disappeared unexpectedly",
# which reads like a Gradle bug rather than an out-of-memory kill.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# Parallel module builds multiply peak memory on a busy machine.
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false

kotlin.code.style=official
# KMP emits a loud warning for targets it considers experimental; we only build
# jvm + android here, both stable.
kotlin.mpp.stability.nowarn=true

android.useAndroidX=true
android.nonTransitiveRClass=true
